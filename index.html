<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanshika | AWS CI/CD Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            max-width: 600px;
        }
        h1 { color: #4338ca; }
        p { color: #475569; line-height: 1.7; }
        .badge {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 10px 16px;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Hello, I'm Vanshika!</h1>
        <p>Welcome to my AWS Cloud & DevOps project.</p>
        <p>This static website is hosted on an AWS EC2 Ubuntu server using Nginx.</p>
        <p>GitHub Actions automates the deployment process through CI/CD.</p>
        <div class="badge">✅ CI/CD Project</div>
        <p>Powered by AWS EC2, Ubuntu, Nginx & GitHub Actions 💜</p>
    </div>
</body>
</html>
